# ==============================================================================
# CVSA production stack.
#
# Deployed by `scripts/deploy-daemon.ts`: the host-side webhook daemon rewrites
# `IMAGE_TAG` in `.env.prod`, drains the crawler, applies database migrations
# with `docker compose run --rm`, and only then runs
# `docker compose up -d --wait` (every service below ships a native healthcheck).
# ==============================================================================
services:
  caddy:
    image: caddy:2.9-alpine
    container_name: cvsa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    # Lets Caddy reach the host-side deploy webhook daemon (`/_deploy`) without
    # publishing the daemon port to the internet.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # Baked into the browser bundle at build time. Empty (the default) means
        # same-origin: Caddy serves `/v2/*` and `/` from SITE_ADDRESS.
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    container_name: cvsa-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 10199
      DATABASE_URL: postgres://${POSTGRES_USER:-cvsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cvsa}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Same-origin default: empty means the browser uses `window.location.origin`
      # and SSR calls the API over the internal Docker network.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:16412}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: cvsa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 16412
      DATABASE_URL: postgres://${POSTGRES_USER:-cvsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cvsa}
      REDIS_URL: redis://redis:6379
      MEILI_API_URL: http://meili:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      EMBEDDING_API_URL: http://embedding:14900
      CONTROL_API_HOST: crawler
      CONTROL_API_PORT: 16413
      CONTROL_API_URL: http://crawler:16413/v2
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      # Caddy's public host; allowed by CORS in addition to WEB_ORIGINS so a
      # custom domain only has to be configured once.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meili:
        condition: service_healthy
      embedding:
        condition: service_healthy

  crawler:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-crawler:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: cvsa-crawler
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SNAPSHOT_DATABASE_URL: postgres://${SNAPSHOT_DB_USER:-cvsa}:${SNAPSHOT_DB_PASSWORD}@snapshot-db:5432/${SNAPSHOT_DB_NAME:-cvsa_snapshot}
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 16413
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      # Discovery classification runs in-process against the ONNX assets below.
      CRAWLER_MODEL_DIR: /app/model
      # Keep the HuggingFace tokenizer cache on the mounted volume so it is
      # downloaded once at first boot instead of on every container restart.
      HF_HOME: /app/model/.cache/huggingface
    volumes:
      # Read-write: `HF_HOME` writes the tokenizer cache into
      # `/app/model/.cache/huggingface` on first boot.
      - ${MODEL_DIR:-./model}:/app/model
    depends_on:
      snapshot-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  embedding:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-embedding:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: embedding
    container_name: cvsa-embedding
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 14900
      # Shares the crawler's tokenizer cache on the mounted model volume.
      HF_HOME: /app/model/.cache/huggingface
    volumes:
      - ${MODEL_DIR:-./model}:/app/model
    deploy:
      resources:
        limits:
          memory: 2G

  db:
    image: postgres:18-alpine
    container_name: cvsa-db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: ${POSTGRES_USER:-cvsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cvsa}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvsa} -d ${POSTGRES_DB:-cvsa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  snapshot-db:
    image: timescale/timescaledb:latest-pg17
    container_name: cvsa-snapshot-db
    restart: always
    environment:
      POSTGRES_DB: ${SNAPSHOT_DB_NAME:-cvsa_snapshot}
      POSTGRES_USER: ${SNAPSHOT_DB_USER:-cvsa}
      POSTGRES_PASSWORD: ${SNAPSHOT_DB_PASSWORD}
    volumes:
      - snapshot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SNAPSHOT_DB_USER:-cvsa} -d ${SNAPSHOT_DB_NAME:-cvsa_snapshot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meili:
    image: getmeili/meilisearch:v1.40
    container_name: cvsa-meili
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili:/meili_data
    # Native healthcheck so `docker compose up -d --wait` blocks on Meilisearch
    # as well, instead of letting the backend race an unready search index.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:7700/health || wget -qO- http://127.0.0.1:7700/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cvsa-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  data:
  snapshot_data:
  meili:
  redis:
