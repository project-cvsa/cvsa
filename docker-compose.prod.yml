services:
  caddy:
    image: caddy:2.9-alpine
    container_name: cvsa-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: cvsa-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 10199
      DATABASE_URL: postgres://${POSTGRES_USER:-cvsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cvsa}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: cvsa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 16412
      DATABASE_URL: postgres://${POSTGRES_USER:-cvsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cvsa}
      REDIS_URL: redis://redis:6379
      MEILI_API_URL: http://meili:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      EMBEDDING_API_URL: http://embedding:14900
      CONTROL_API_HOST: crawler
      CONTROL_API_PORT: 16413
      CONTROL_API_URL: http://crawler:16413/v2
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meili:
        condition: service_started
      embedding:
        condition: service_healthy

  crawler:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-crawler:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: crawler
    container_name: cvsa-crawler
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SNAPSHOT_DATABASE_URL: postgres://${SNAPSHOT_DB_USER:-cvsa}:${SNAPSHOT_DB_PASSWORD}@snapshot-db:5432/${SNAPSHOT_DB_NAME:-cvsa_snapshot}
      CONTROL_API_HOST: 0.0.0.0
      CONTROL_API_PORT: 16413
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      # Discovery classification is delegated to the dedicated `inference`
      # service; the crawler never loads ONNX in-process.
      ML_API_URL: http://inference:8544
      # Only read by the crawler's in-process fallback classifier, which points
      # at the mounted `/app/model` copy of the same assets.
      CRAWLER_MODEL_DIR: /app/model
    volumes:
      # Fallback asset location for operators migrating the legacy on-disk
      # models; the crawler itself reads them through `inference`.
      - ${MODEL_DIR:-./model}:/app/model:ro
    depends_on:
      snapshot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_healthy

  inference:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-inference:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: inference
    container_name: cvsa-inference
    restart: unless-stopped
    # The HTTP server drains in-flight classifications before exiting on SIGTERM.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      CVSA_INFERENCE_HOST: 0.0.0.0
      CVSA_INFERENCE_PORT: 8544
      CVSA_INFERENCE_EMBEDDING_MODEL_PATH: ${INFERENCE_EMBEDDING_MODEL_PATH:-/app/model/embedding/model.onnx}
      CVSA_INFERENCE_CLASSIFIER_MODEL_PATH: ${INFERENCE_CLASSIFIER_MODEL_PATH:-/app/model/akari/3.17.onnx}
      CVSA_INFERENCE_TOKENIZER_PATH: ${INFERENCE_TOKENIZER_PATH:-/app/model/embedding}
    volumes:
      # Read-only: the engine verifies every asset against its pinned manifest.
      - ${MODEL_DIR:-./model}:/app/model:ro
    # `/ready` (not `/health`) so a container that cannot load its ONNX assets
    # never reports healthy and the crawler is not started against it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8544/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G

  embedding:
    image: ${IMAGE_REGISTRY:-ghcr.io/project-cvsa}/cvsa-embedding:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: embedding
    container_name: cvsa-embedding
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 14900
    volumes:
      - ${MODEL_DIR:-./model}:/app/model
    deploy:
      resources:
        limits:
          memory: 2G

  db:
    image: postgres:18-alpine
    container_name: cvsa-db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_USER: ${POSTGRES_USER:-cvsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cvsa}
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cvsa} -d ${POSTGRES_DB:-cvsa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  snapshot-db:
    image: timescale/timescaledb:latest-pg17
    container_name: cvsa-snapshot-db
    restart: always
    environment:
      POSTGRES_DB: ${SNAPSHOT_DB_NAME:-cvsa_snapshot}
      POSTGRES_USER: ${SNAPSHOT_DB_USER:-cvsa}
      POSTGRES_PASSWORD: ${SNAPSHOT_DB_PASSWORD}
    volumes:
      - snapshot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SNAPSHOT_DB_USER:-cvsa} -d ${SNAPSHOT_DB_NAME:-cvsa_snapshot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  meili:
    image: getmeili/meilisearch:v1.40
    container_name: cvsa-meili
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili:/meili_data

  redis:
    image: redis:7-alpine
    container_name: cvsa-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  data:
  snapshot_data:
  meili:
  redis:
