# TimescaleDB (PostgreSQL 17) Configuration for CVSA Snapshot Database
#
# Attached via docker-compose volume mount at /etc/postgresql/custom.conf

# Extensions & Runtime Statistics
shared_preload_libraries = 'timescaledb,pg_stat_statements'
pg_stat_statements.track = all

# Query Planner & Cost Tuning (SSD / NVMe optimized)
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
autovacuum_vacuum_scale_factor = 0.05

# Memory Sizing (Tuned for ~4GB container memory limit)
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Parallel Query & Worker Processes
max_worker_processes = 16
max_parallel_workers = 8
