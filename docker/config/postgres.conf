# PostgreSQL 18 Configuration for CVSA Primary Catalog Database
#
# Attached via docker-compose volume mount at /etc/postgresql/custom.conf

# Extensions & Runtime Statistics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# Query Planner & Cost Tuning (SSD / NVMe optimized)
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9

# Memory Sizing (Tuned for ~2GB container memory limit)
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB
