name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prepare .env files
        run: |
          cp .env.docker.example .env.docker
          cp packages/db/.env.example packages/db/.env
          cp packages/db/.env.example packages/db/.env.test
          cp apps/backend/.env.example apps/backend/.env.test
          cp apps/crawler/.env.example apps/crawler/.env.test

      - name: Start backing services
        run: docker compose up -d

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test databases & emit contracts
        run: bun run setup:ci

      - name: Lint & Format Check
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run Contract & Integration Tests
        run: bun run test

      - name: Verify Production Web Build
        run: bun run --cwd apps/web build

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify inference image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          target: inference
          push: false
          cache-from: type=gha,scope=cvsa-inference
          cache-to: type=gha,mode=max,scope=cvsa-inference

      - name: Stop backing services
        if: always()
        run: docker compose down -v
