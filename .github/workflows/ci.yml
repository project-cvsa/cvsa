name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prepare .env files
        run: |
          cp .env.example .env
          cp packages/db/.env.example packages/db/.env
          cp packages/db/.env.test.example packages/db/.env.test
          cp apps/backend/.env.test.example apps/backend/.env.test
          cp apps/crawler/.env.example apps/crawler/.env.test

      - name: Start backing services
        # `--wait` blocks until every container reports healthy, so Postgres,
        # TimescaleDB, Redis and Meilisearch are accepting connections before
        # `setup:ci` runs instead of racing their first-boot initialization.
        run: docker compose up -d --wait --wait-timeout 240 db snapshot-db redis meili

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test databases & emit contracts
        run: bun run setup:ci

      - name: Lint & Format Check
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run Contract & Integration Tests
        run: bun run test

      - name: Verify Production Web Build
        run: bun run --cwd apps/web build

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Stop backing services
        if: always()
        run: docker compose down -v
