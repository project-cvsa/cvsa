name: Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  # Every application image built from the layered Dockerfile. Keep in sync with
  # the targets in `Dockerfile` and the services in `docker-compose.prod.yml`.
  IMAGE_TARGETS: backend crawler embedding inference web

jobs:
  verify:
    name: Contract Tests, Typecheck & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prepare .env files
        run: |
          cp .env.docker.example .env.docker
          cp packages/db/.env.example packages/db/.env
          cp packages/db/.env.example packages/db/.env.test
          cp apps/backend/.env.example apps/backend/.env.test
          cp apps/crawler/.env.example apps/crawler/.env.test

      - name: Start backing services
        run: docker compose up -d

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test databases & emit contracts
        run: bun run setup:ci

      - name: Lint & Format Check
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run Contract & Integration Tests
        run: bun run test

      - name: Verify Production Web Build
        run: bun run --cwd apps/web build

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet

      - name: Stop backing services
        if: always()
        run: docker compose down -v

  build-and-push:
    name: Build & Push Layered Images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tag
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Service Images
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for target in ${IMAGE_TARGETS}; do
            docker buildx build \
              --target "$target" \
              --cache-from type=gha,scope="cvsa-$target" \
              --cache-to type=gha,mode=max,scope="cvsa-$target" \
              --tag "${IMAGE_PREFIX}/cvsa-${target}:${SHA_TAG}" \
              --tag "${IMAGE_PREFIX}/cvsa-${target}:latest" \
              --push \
              .
          done

      - name: Smoke Test Built Backend & Inference Images
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          docker compose up -d

          # Backend answers its health endpoint against the real backing services.
          docker run --rm -d --name smoke-backend --network host \
            -e NODE_ENV=production \
            -e HOST=127.0.0.1 \
            -e PORT=16412 \
            -e DATABASE_URL="postgres://cvsa:password@127.0.0.1:5432/cvsa" \
            -e REDIS_URL="redis://127.0.0.1:6379" \
            -e MEILI_API_URL="http://127.0.0.1:7700" \
            -e MEILI_MASTER_KEY="0712041211241099" \
            "${IMAGE_PREFIX}/cvsa-backend:${SHA_TAG}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:16412/v2/health; then
              echo "Backend image verified"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:16412/v2/health
          docker stop smoke-backend

          # Inference boots without model assets and reports readiness honestly:
          # `/health` is a liveness 200, `/ready` must stay 503 until the pinned
          # ONNX assets are verified and loaded.
          docker run --rm -d --name smoke-inference --network host \
            -e NODE_ENV=production \
            -e CVSA_INFERENCE_HOST=127.0.0.1 \
            -e CVSA_INFERENCE_PORT=8544 \
            -e CVSA_INFERENCE_EMBEDDING_MODEL_PATH=/tmp/missing/embedding/model.onnx \
            -e CVSA_INFERENCE_CLASSIFIER_MODEL_PATH=/tmp/missing/akari/3.17.onnx \
            -e CVSA_INFERENCE_TOKENIZER_PATH=/tmp/missing/embedding \
            "${IMAGE_PREFIX}/cvsa-inference:${SHA_TAG}"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8544/health; then
              echo "Inference image verified"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8544/health
          test "$(curl -o /dev/null -s -w '%{http_code}' http://127.0.0.1:8544/ready)" = "503"
          docker stop smoke-inference

  deploy:
    name: Deploy to VPS with Rollback Protection
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      # The deploy path is expected to hold a checkout of this repository at the
      # released commit (compose file + `docker/` helpers); rollback only rewrites
      # `IMAGE_TAG` in `.env.prod` and re-runs the same stack.
      - name: Rollout on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH || '/opt/cvsa' }}"

            PREV_TAG=$(grep -E '^IMAGE_TAG=' .env.prod | cut -d= -f2 || echo "latest")
            NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"

            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            sed -i.bak "s/^IMAGE_TAG=.*/IMAGE_TAG=${NEW_TAG}/" .env.prod || echo "IMAGE_TAG=${NEW_TAG}" >> .env.prod

            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend crawler web embedding inference

            # Drain the crawler before anything else: it is the only dispatcher, so
            # no two generations may overlap during the rollout.
            bash ./docker/verify-rollout.sh drain

            # Apply database migrations before starting new application containers
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend bun run --filter @cvsa/db migrate:deploy
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm crawler bun run --filter @cvsa/snapshot-db migrate:deploy

            # Start updated services (crawler last, once inference is ready)
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            # Verify health checks (inference readiness included), rollback to PREV_TAG on failure
            if ! bash ./docker/verify-rollout.sh; then
              echo "Rollout verification failed, rolling back to ${PREV_TAG}"
              sed -i.bak "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" .env.prod
              bash ./docker/verify-rollout.sh drain || true
              docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
              exit 1
            fi
