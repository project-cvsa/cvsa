name: Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to release
        type: choice
        default: affected
        options: [affected, all, backend, crawler, embedding, web]

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: plan
        env:
          RELEASE_SERVICE: ${{ inputs.service || 'affected' }}
          TURBO_SCM_BASE: ${{ github.event.before || 'HEAD^' }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: bun apps/deploy/src/plan.ts

  build-and-push:
    name: Build & Push Layered Images
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Image Tag
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Service Images
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          docker buildx build \
            --target "$target" \
            --cache-from type=gha,scope="cvsa-$target" \
            --cache-to type=gha,mode=max,scope="cvsa-$target" \
            --tag "${IMAGE_PREFIX}/cvsa-${target}:${SHA_TAG}" \
            --tag "${IMAGE_PREFIX}/cvsa-${target}:latest" \
            --push .

  deploy:
    name: Deploy to Server
    needs: [plan, build-and-push]
    if: github.ref == 'refs/heads/main' && vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger and monitor deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          IMAGE_TAG: ${{ needs.plan.outputs.tag }}
          SERVICES: ${{ needs.plan.outputs.services }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL must be configured when ENABLE_VPS_DEPLOY is enabled." >&2
            exit 1
          fi

          AUTH_HEADER=()
          if [ -n "${DEPLOY_WEBHOOK_SECRET}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${DEPLOY_WEBHOOK_SECRET}")
          fi

          echo "Triggering webhook: ${DEPLOY_WEBHOOK_URL} with tag: ${IMAGE_TAG}"
          HTTP_STATUS=$(curl -fsS --max-time 15 -o /tmp/deploy-response.json -w "%{http_code}" -X POST "${AUTH_HEADER[@]}" \
            -H "Content-Type: application/json" \
            -d "$(jq -cn --arg tag "$IMAGE_TAG" --argjson services "$SERVICES" '{tag:$tag,services:$services}')" \
            "${DEPLOY_WEBHOOK_URL}")

          echo "Webhook response status: ${HTTP_STATUS}"
          cat /tmp/deploy-response.json
          echo ""

          if [ "${HTTP_STATUS}" != "200" ] && [ "${HTTP_STATUS}" != "202" ]; then
            echo "::error::Webhook trigger failed with status ${HTTP_STATUS}" >&2
            exit 1
          fi

          DEPLOY_ID=$(jq -r .id /tmp/deploy-response.json)
          STATUS_URL="${DEPLOY_WEBHOOK_URL}"
          case "${STATUS_URL}" in
            */deploy) STATUS_URL="${STATUS_URL%/deploy}/status" ;;
            *) STATUS_URL="${STATUS_URL%/}/status" ;;
          esac

          echo "Monitoring deployment status at ${STATUS_URL}..."
          MAX_WAIT_SECONDS=900
          POLL_INTERVAL=10
          ELAPSED=0

          while [ "${ELAPSED}" -lt "${MAX_WAIT_SECONDS}" ]; do
            sleep "${POLL_INTERVAL}"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))

            STATUS_BODY=$(curl -fsS --connect-timeout 5 --max-time 10 "${AUTH_HEADER[@]}" "${STATUS_URL}" 2>/dev/null || true)
            if [ -z "${STATUS_BODY}" ]; then
              echo "[${ELAPSED}s] Failed to fetch deployment status, retrying..."
              continue
            fi

            DEPLOY_STATUS=$(echo "${STATUS_BODY}" | jq -r '.status // "unknown"')
            DEPLOY_TAG=$(echo "${STATUS_BODY}" | jq -r '.tag // ""')
            EXIT_CODE=$(echo "${STATUS_BODY}" | jq -r '.exitCode // empty')

            echo "[${ELAPSED}s] Deployment status: ${DEPLOY_STATUS} (tag: ${DEPLOY_TAG})"

            if [ "$(echo "$STATUS_BODY" | jq -r .id)" = "$DEPLOY_ID" ]; then
              if [ "${DEPLOY_STATUS}" = "success" ]; then
                echo "Deployment for tag ${IMAGE_TAG} completed successfully in ${ELAPSED}s."
                exit 0
              elif [ "${DEPLOY_STATUS}" = "failed" ]; then
                echo "::error::Deployment failed with exit code ${EXIT_CODE}" >&2
                echo "${STATUS_BODY}" >&2
                exit 1
              fi
            fi
          done

          echo "::error::Deployment timed out after ${MAX_WAIT_SECONDS}s" >&2
          exit 1
